services:
  backend:
    build:
      context: ./backend
    image: well-health-backend:1.0
    container_name: well-health-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: well-health-frontend:1.0
    container_name: well-health-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
