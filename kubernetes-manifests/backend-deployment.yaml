apiVersion: apps/v1
kind: Deployment
metadata:
  name: well-health-backend
  namespace: well-health-care
spec:
  replicas: 1
  selector:
    matchLabels:
      app: well-health-backend
  template:
    metadata:
      labels:
        app: well-health-backend
    spec:
      containers:
        - name: backend
          image: well-health-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000